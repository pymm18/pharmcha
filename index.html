<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonjour Madam</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Trirong:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2e6c9;--mute:#c9b88f;--gold:#c9a45c;--panel:rgba(36,24,40,.86);--pass:#c9efd6;--passbg:#2d4a39;--fail:#f6c8c0;--failbg:#582a2d;--wait:#f2dd9c;--waitbg:#5a4a20;--font:"IM Fell English","Trirong",serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#9aa0ad;color:var(--ink);font:17px/1.6 var(--font)}
.hidden{display:none!important}
#bg{display:none}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ===== หน้าเปิด ===== */
#intro{display:flex;justify-content:center;cursor:pointer}
.stage{position:relative;width:100%;aspect-ratio:1/2;background:url(background.png) center/100% 100% no-repeat;container-type:inline-size}
/* กรอบข้อความ: ปรับ % ตรงนี้ถ้าอยากขยับให้พอดีกรอบสีม่วงในภาพ */
.panel{position:absolute;left:27%;right:27%;top:11%;bottom:41%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.msg{width:100%;opacity:1;transition:opacity .6s}
.msg.out{opacity:0}
.big{font-size:7.5cqw;line-height:1.25;font-style:italic;text-shadow:0 0 12px rgba(201,164,92,.35)}
.hint{position:absolute;bottom:3%;font-size:3.4cqw;font-style:italic;color:var(--mute);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.sentence{font-size:4.4cqw;line-height:1.9;cursor:default}
.sentence input{font:inherit;color:var(--gold);background:transparent;border:0;border-bottom:1px solid var(--gold);border-radius:0;text-align:center;width:6ch;max-width:100%;padding:0 2px}
.sentence input::placeholder{color:rgba(201,164,92,.5);font-style:italic}
.err{margin:6px 0 0;min-height:1.4em;font-size:3.6cqw;color:#f0a79c}
.btn{margin-top:4px;font:italic 5cqw var(--font);color:var(--ink);background:rgba(201,164,92,.15);border:1px solid var(--gold);border-radius:3px;padding:.35em 1.4em;letter-spacing:.06em;cursor:pointer}
.btn:hover{background:rgba(201,164,92,.3)}

/* ===== หน้าผลลัพธ์  ===== */
#result{
  --w:min(92vw,560px);
  background: url(resultbg.png) center / cover no-repeat fixed;
  position: relative;
  color: #9a4c32;
  min-height:100vh;
  container-type:inline-size;
}
#result main{
  width: 60cqw;
  margin: 0 auto;
  padding: 10cqw 0 0;
  position: relative;
  text-align: center;
}
.status{
  margin: 0 0 calc(var(--w)*.02) ;
  font-size: calc(var(--w)*.045);
  font-weight:700;
  line-height:1.25;
  text-align: center;
}
  
.who{
  margin: 0 0 calc(var(--w)*.03);
  font-size: calc(var(--w)*.036);
  font-weight: 400;
  line-height: 1.5;
  text-align: center;
}
  
h2{
  margin:calc(var(--w)*.02) 0 0;
  font-size:calc(var(--w)*.04);
  font-weight:600;
}
  
.score{
  width:100%;
  margin:0 auto
  font-size:calc(var(--w)*.034);
  table-layout:fixed;
}
  
.score th,
.score td{
  
  border-bottom:1px solid rgba(154,76,50,.45);
  text-align:center;
  width: 28%
}


.score th{font-weight:600;border-bottom:2px solid #9a4c32}
.score tfoot td{font-weight:700;border-top:2px solid #9a4c32;border-bottom:0}
.none{color:#888}
</style>
</head>
<body class="intro">
<div id="bg"></div>

<!-- หน้าเปิด -->
<section id="intro">
  <div class="stage">
    <div class="panel">
      <div id="msg" class="msg"></div>
      <div id="hint" class="hint">· click anywhere ·</div>
    </div>
  </div>
</section>

<!-- หน้าผลลัพธ์ -->
<section id="result" class="hidden">
  <main>
    <div id="status" class="status"></div>
    <p id="who" class="who"></p>
    <div id="rounds"></div>
    <div style="max-width:180px;margin:auto;">
      <canvas id="chart-r1"></canvas>
    </div>

  </main>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<script>
// ===== ตั้งค่า (แก้เฉพาะส่วนนี้) =====
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQTSaIGDWW3Stb2DZE3hglnlQbXkySn74oEOPmXO68fXHugGsVutg9ckJfHUrKWfpYXEhK1Ht8DCBAZ/pub?gid=505430599&single=true&output=csv";

const COL = {
  id: "Code",
  user: "Name",
  status: "Status",
  rounds: [
    {
      title: "รอบ 1",
      subjects: [
        { name: "เคมี", score: "Score R1 chem", pct: "Percentile R1 chem" },
        { name: "ชีวะ", score: "Score R1 bio", pct: "Percentile R1 bio" },
        { name: "ฟิสิกส์", score: "Score R1 phy", pct: "Percentile R1 phy" }
      ],
      total: { score: "Score R1", pct: "Percentile R1" }
    },
    {
      title: "รอบ 2",
      subjects: [
        { name: "เคมี", score: "Score R2 chem", pct: "Percentile R2 chem" },
        { name: "ชีวะ", score: "Score R2 bio", pct: "Percentile R2 bio" },
        { name: "ฟิสิกส์", score: "Score R2 phy", pct: "Percentile R2 phy" }
      ],
      total: { score: "Score R2", pct: "Percentile R2" }
    },
    {
      title: "รอบ 3",
      subjects: [
        { name: "เคมี", score: "Score R3 chem", pct: "Percentile R3 chem" },
        { name: "ชีวะ", score: "Score R3 bio", pct: "Percentile R3 bio" },
        { name: "ฟิสิกส์", score: "Score R3 phy", pct: "Percentile R3 phy" }
      ],
      total: { score: "Score R3", pct: "Percentile R3" }
    },
    {
      title: "Lab",
      subjects: [
        { name: "Lab 1", score: "Score Lab 1", pct: "Percentile Lab 1" },
        { name: "Lab 2", score: "Score Lab 2", pct: "Percentile Lab 2" }
      ]
    }
  ]
}
  
// ====================================

const $ = id => document.getElementById(id);
const norm = s => String(s ?? "").trim().replace(/\s+/g, " ").toLowerCase();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has = v => { const t = String(v ?? "").trim(); return t !== "" && !t.startsWith("#"); };

/* ---------- โหลดข้อมูลชีต ---------- */
let rows = [], ready = false, failed = "";
fetch(CSV_URL)
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(t => {
    rows = Papa.parse(t, { header: true, skipEmptyLines: true, transformHeader: h => h.trim() }).data;
    ready = true;
  })
  .catch(e => {
    failed = location.protocol === "file:"
      ? "เปิดไฟล์จากเครื่องโดยตรงไม่ได้ ต้องเปิดผ่านเว็บ เช่น GitHub Pages"
      : "โหลดข้อมูลไม่สำเร็จ (" + e.message + ")";
  });

/* ---------- ลำดับข้อความหน้าเปิด ---------- */
const STEPS = [
  () => `<div class="big">Bonjour Madam</div>`,
  () => `<div class="big">Let's we know ,<br>WHO ARE YOU ?</div>`,
  () => `<div class="sentence">I'm <input id="nameIn" placeholder="name" autocomplete="off"> order <input id="codeIn" placeholder="code" autocomplete="off">, I solemnly swear that I'm an incomparable potioneer</div><p id="err" class="err" role="alert"></p><button class="btn" id="go">unfold!</button>`
];
const msg = $("msg");
let step = 0, busy = false;
msg.innerHTML = STEPS[0]();

function setStep(n){
  busy = true;
  msg.classList.add("out");
  setTimeout(() => {
    step = n;
    msg.innerHTML = STEPS[n]();
    $("hint").classList.toggle("hidden", n === 2);
    if (n === 2) bindForm();
    msg.classList.remove("out");
    busy = false;
  }, 600);
}
document.addEventListener("click", () => { if (!busy && step < 2 && !$("intro").classList.contains("hidden")) setStep(step + 1); });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !busy && step < 2 && !$("intro").classList.contains("hidden")) setStep(step + 1);
});

function bindForm(){
  const n = $("nameIn"), c = $("codeIn");
  const grow = (el, min) => el.style.width = Math.max(min, el.value.length + 1) + "ch";
  n.addEventListener("input", () => grow(n, 6));
  c.addEventListener("input", () => grow(c, 4));
  [n, c].forEach(el => el.addEventListener("keydown", e => e.key === "Enter" && check()));
  $("go").onclick = check;
  n.focus();
}

/* ---------- ตรวจสอบและแสดงผล ---------- */
let myPieChart = null;
  
function drawPie(id, score, total = 30) { 
  const canvas = document.getElementById(id);
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  
   if (myPieChart)  {
     myPieChart.destroy();
   }
  
   myPieChart = new Chart(ctx, { 
     type: 'pie',
      data: { 
        labels: ['ข้อถูก', 'ข้อผิด'],
              datasets: [{ 
                data: [score, total - score], 
                backgroundColor: ['#4a7c59', '#a33b3b'] 
              }] 
      },
    options: { 
      plugins: { 
        legend: { 
          position: 'bottom' 
        } 
      } 
    } 
   }); 
}
    drawPie('chart-r1', Number(p[COL.total.score]));
  
function show(view){
  $("intro").classList.toggle("hidden", view !== "intro");
  $("result").classList.toggle("hidden", view !== "result");
  document.body.classList.toggle("intro", view === "intro");
  window.scrollTo(0, 0);
}

function check(){
  const err = $("err");
  const id = norm($("codeIn").value), name = norm($("nameIn").value);
  if (failed) { err.textContent = failed; return; }
  if (!ready) { err.textContent = "กำลังโหลดข้อมูล รอสักครู่แล้วลองอีกครั้ง"; return; }
  const p = id && name && rows.find(r => norm(r[COL.id]) === id && norm(r[COL.user]) === name);
  if (!p) { err.textContent = "ไม่พบข้อมูล"; return; }
  render(p);
}
  
function cell(row, key) {
  const v = row[key];
  if (!has(v)) return '<span class="none">ไม่พบข้อมูล</span>';
  const n = Number(v);
  return esc(String(isNaN(n) ? v : Math.round(n * 100) / 100));
}

function roundsToShow(row) {
  const s = (row[COL.status] ?? "").toString()
    .replace(/[๐-๙]/g, d => "๐๑๒๓๔๕๖๗๘๙".indexOf(d));
  const m = s.match(/\d+/);
  return m ? Number(m[0]) : 1;
}

function renderRounds(row) {
  const n = roundsToShow(row);
  const list = COL.rounds.filter((r, i) =>
    r.optional ? r.subjects.some(s => has(row[s.score])) : i < n);
  $("rounds").innerHTML = list.map(r => `
    <h2>${r.title}</h2>
    <table class="score">
      <thead><tr><th>วิชา</th><th>คะแนน</th><th>เปอร์เซนไทล์</th></tr></thead>
      <tbody>
        ${r.subjects.map(s => `
          <tr><td>${s.name}</td><td>${cell(row, s.score)}</td><td>${cell(row, s.pct)}</td></tr>`).join("")}
      </tbody>
      ${r.total ? `<tfoot><tr><td>รวม</td><td>${cell(row, r.total.score)}</td><td>${cell(row, r.total.pct)}</td></tr></tfoot>` : ""}
    </table>`).join("");
}

function render(p){
  const st = p[COL.status], v = norm(st);
  const cls = !has(st) ? "wait" : v.includes("ไม่") ? "fail" : (v.includes("ผ่าน") || v.includes("อันดับ")) ? "pass" : "wait";
  $("status").className = "status " + cls;
  $("status").textContent = has(st) ? st : "ไม่พบข้อมูล";
  $("who").innerHTML = "ชื่อ: " + esc(p[COL.user]) + "<br>รหัส: " + esc(p[COL.id]);
  const val = x => has(x) ? esc(x) : `<span class="none">ไม่พบข้อมูล</span>`;
  renderRounds(p);
  show("result"); }


</script>
</body>
</html>
